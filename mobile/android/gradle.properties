org.gradle.jvmargs=-Xmx4096M
# Works around a Windows-specific Gradle/Kotlin incremental-compiler bug where
# antivirus/cloud-sync file locks on .tab cache files under build/ cause
# "Could not close incremental caches" failures (seen with image_picker_android).
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
