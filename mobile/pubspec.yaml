name: invoice_capture
description: Meridian Brothers — mobile invoice & supporting document capture for field workers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP client
  dio: ^5.4.3

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Local offline queue
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera
  camera: ^0.10.5+9

  # Image compression
  image: ^4.1.7

  # Connectivity / auto-sync trigger
  connectivity_plus: ^6.0.3

  # UUID generation for local queue IDs
  uuid: ^4.4.0

  # Permissions helper
  permission_handler: ^11.3.1

  # Path helpers
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
