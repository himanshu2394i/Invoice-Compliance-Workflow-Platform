name: Polyglot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-go-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: invoice_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache-dependency-path: backend/go.sum

    - name: Go Format Check
      working-directory: ./backend
      run: |
        diff <(gofmt -l .) <(echo -n "") || (echo "Run 'go fmt ./...' to fix formatting" && exit 1)

    - name: Go Vet
      working-directory: ./backend
      run: go vet ./...

    - name: Run database migrations
      working-directory: ./backend
      env:
        MIGRATIONS_DATABASE_URL: postgres://admin:password@127.0.0.1:5432/invoice_saas?sslmode=disable
      run: go run ./cmd/migrate up

    - name: Start Temporal dev server
      run: |
        curl -sSf https://temporal.download/cli.sh | sh
        ~/.temporalio/bin/temporal server start-dev --headless &
        for i in $(seq 1 30); do
          (echo > /dev/tcp/127.0.0.1/7233) >/dev/null 2>&1 && break
          sleep 1
        done

    - name: Build API and Worker
      working-directory: ./backend
      run: |
        go build -o bin/api ./cmd/api
        go build -o bin/worker ./cmd/worker

    - name: Start worker
      working-directory: ./backend
      env:
        DATABASE_URL: postgres://app_user:app_user_dev_password@127.0.0.1:5432/invoice_saas
        TEMPORAL_HOSTPORT: 127.0.0.1:7233
      run: |
        ./bin/worker &
        WORKER_PID=$!
        sleep 5
        if ! kill -0 $WORKER_PID 2>/dev/null; then
          echo "ERROR: worker process exited immediately after starting" >&2
          exit 1
        fi
        echo "WORKER_PID=$WORKER_PID" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python OCR worker dependencies
      working-directory: ./backend/python_worker
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Python OCR worker
      working-directory: ./backend/python_worker
      run: |
        python main.py &
        OCR_WORKER_PID=$!
        sleep 5
        if ! kill -0 $OCR_WORKER_PID 2>/dev/null; then
          echo "ERROR: Python OCR worker process exited immediately after starting" >&2
          exit 1
        fi
        echo "OCR_WORKER_PID=$OCR_WORKER_PID" >> "$GITHUB_ENV"

    - name: Run tests
      working-directory: ./backend
      env:
        TEST_DATABASE_URL: postgres://app_user:app_user_dev_password@127.0.0.1:5432/invoice_saas
        TEST_TEMPORAL_HOSTPORT: 127.0.0.1:7233
      run: |
        # The startup checks above only catch a worker that died in its first
        # 5s. Keep watching both PIDs for the full test run too, so a worker
        # that dies mid-suite fails fast with a clear message instead of
        # surfacing as a confusing test hang/timeout.
        go test ./... -v &
        TEST_PID=$!

        (
          while true; do
            sleep 2
            if ! kill -0 "$TEST_PID" 2>/dev/null; then
              exit 0 # tests already finished; nothing left to watch
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "::error::Go worker (pid $WORKER_PID) died during the test run" >&2
              kill -TERM "$TEST_PID" 2>/dev/null
              exit 1
            fi
            if ! kill -0 "$OCR_WORKER_PID" 2>/dev/null; then
              echo "::error::Python OCR worker (pid $OCR_WORKER_PID) died during the test run" >&2
              kill -TERM "$TEST_PID" 2>/dev/null
              exit 1
            fi
          done
        ) &
        WATCHDOG_PID=$!

        # GitHub Actions runs this script with `set -e`; without disabling it
        # here, a non-zero `wait` would abort the script before the watchdog
        # gets cleaned up and the real exit code gets propagated below.
        set +e
        wait "$TEST_PID"
        TEST_EXIT=$?
        set -e

        kill "$WATCHDOG_PID" 2>/dev/null
        exit $TEST_EXIT

  test-python-ml:
    name: Test Python ML Worker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend/python_worker
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
        
    - name: Lint with flake8
      working-directory: ./backend/python_worker
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-nextjs-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
      
    - name: Build
      working-directory: ./frontend
      run: npm run build

  test-flutter-mobile:
    name: Test Flutter Mobile App
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Install dependencies
      working-directory: ./mobile
      run: flutter pub get

    - name: Analyze
      working-directory: ./mobile
      run: |
        # --no-fatal-infos/--no-fatal-warnings stop pre-existing warnings/infos
        # from failing CI, but applied bare they'd also let *new* ones slide in
        # forever. Instead, only let the issue count stay at or below the
        # checked-in baseline (analysis_baseline.txt) -- a real analyzer ERROR
        # still fails the build immediately, regardless of the baseline.
        set +e
        OUTPUT=$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1)
        ANALYZE_EXIT=$?
        set -e
        echo "$OUTPUT"

        if [ "$ANALYZE_EXIT" -ne 0 ]; then
          echo "::error::flutter analyze failed (a real analyzer error, not just warnings/infos)"
          exit $ANALYZE_EXIT
        fi

        BASELINE=$(cat analysis_baseline.txt)
        CURRENT=$(echo "$OUTPUT" | grep -cE '^\s*(warning|info)\s-\s')
        echo "Lint warning/info count: $CURRENT (baseline: $BASELINE)"
        if [ "$CURRENT" -gt "$BASELINE" ]; then
          echo "::error::flutter analyze found $CURRENT warning/info issues, more than the $BASELINE-issue baseline in mobile/analysis_baseline.txt. Fix the new issue(s), or if the increase is intentional, update the baseline file in the same PR."
          exit 1
        fi

    - name: Test
      working-directory: ./mobile
      run: flutter test
