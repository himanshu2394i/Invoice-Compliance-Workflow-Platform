services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invoice_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Setup initialization script to create temporal DB as well
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  temporal:
    image: temporalio/auto-setup:1.24.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.27.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  ocr-worker:
    build:
      context: ./backend/python_worker
    environment:
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - temporal
    restart: on-failure

  worker:
    build:
      context: ./backend
      dockerfile: cmd/worker/Dockerfile
    environment:
      - DATABASE_URL=postgres://app_user:app_user_dev_password@postgres:5432/invoice_saas
      - TEMPORAL_HOSTPORT=temporal:7233
    depends_on:
      - postgres
      - temporal
    restart: on-failure

volumes:
  postgres_data:
